name: Build BatchCost APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download project
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
        continue-on-error: true

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      # 4. Install Capacitor if required
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 5. Initialize Capacitor if not already initialized
      - name: Prepare Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init BatchCost com.batchcost.app --web-dir=www
          fi

      # 6. Build web application if package.json has build script
      - name: Build web app
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "No web build script found."
          fi

      # 7. Make sure www exists
      - name: Prepare web assets
        run: |
          mkdir -p www

          if [ -d dist ]; then
            cp -r dist/* www/
          elif [ -d build ]; then
            cp -r build/* www/
          elif [ -f index.html ]; then
            cp -r ./* www/ || true
          fi

      # 8. Add Android platform
      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 9. Sync Capacitor
      - name: Sync Android
        run: |
          npx cap sync android

      # 10. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 11. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 12. Build debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatchCost-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
